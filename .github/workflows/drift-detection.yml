# Scheduled drift-check job
# Runs every 1 hours via cron (or manually via workflow_dispatch).
# Uses GitHub Actions OIDC to assume a least-privilege Drift Detection IAM Role
# Exit codes from `terraform plan -detailed-exitcode`:
#   0 = no changes (no drift)
#   1 = error
#   2 = changes present (drift detected)

name: "Drift Detection"

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
    inputs:
      force_remediation:
        description: "Force a remediation PR even if drift is minor"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: drift-detection
  cancel-in-progress: false

permissions:
  id-token: write       # Required for AWS OIDC token generation
  contents: write       # Required to create drift branches & push sanitized summaries
  pull-requests: write  # Required to create/update PRs

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform
  TF_VERSION: "1.5.7"

jobs:
  # ── Job 1: Detect Drift ────────────────────────────────────────────────────
  detect-drift:
    name: "Detect Terraform Drift"
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # Disable wrapper so exit codes pass through cleanly

      - name: Configure AWS credentials via OIDC (Detection Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DRIFT_DETECTION_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DriftDetection

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan (drift check)
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          set +e  # Don't exit on non-zero; we branch on exit code

          terraform plan \
            -detailed-exitcode \
            -input=false \
            -out=plan.tfplan \
            2>&1 | tee plan-output.txt

          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT

          if [ "$EXITCODE" -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "::warning::Drift detected! Exit code 2 — live infrastructure has drifted from state."
          elif [ "$EXITCODE" -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No drift detected. Infrastructure matches Terraform state."
          else
            echo "drift_detected=error" >> $GITHUB_OUTPUT
            echo "::error::Terraform plan failed with exit code $EXITCODE"
            exit 1
          fi

      - name: Convert plan to JSON (for parsing)
        if: steps.plan.outputs.drift_detected == 'true'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform show -json plan.tfplan > plan.json
          echo "Plan JSON generated: $(wc -c < plan.json) bytes"

      - name: Upload encrypted CI plan artifacts (short retention)
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ github.run_id }}
          path: |
            ${{ env.TF_DIR }}/plan.tfplan
            ${{ env.TF_DIR }}/plan.json
            ${{ env.TF_DIR }}/plan-output.txt
          retention-days: 3

      - name: Log — clean status
        if: steps.plan.outputs.drift_detected == 'false'
        run: |
          echo "✅ No drift detected at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Infrastructure matches Terraform state. No remediation needed."

  # ── Job 2: Parse drift + create remediation PR ────────────────────────────
  remediate-drift:
    name: "Parse Drift & Create Remediation PR"
    runs-on: ubuntu-latest
    needs: detect-drift
    if: needs.detect-drift.outputs.drift_detected == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          name: drift-plan-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests boto3

      - name: Configure AWS credentials for CloudTrail correlation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DRIFT_DETECTION_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CloudTrailLookup

      - name: Parse drift & classify risk (with sanitization & cycle ID)
        id: parse
        run: |
          python scripts/parse_drift.py \
            --plan-json ${{ env.TF_DIR }}/plan.json \
            --output-file drift-summary.json \
            --github-output $GITHUB_OUTPUT

      - name: Log drift event & correlate with CloudTrail
        run: |
          python scripts/log_drift_event.py \
            --action detect \
            --drift-summary drift-summary.json \
            --cycle-id "${{ steps.parse.outputs.cycle_id }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Create drift-fix branch (sanitized evidence only)
        id: branch
        env:
          AUTH_TOKEN: ${{ secrets.DRIFT_GITHUB_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          CYCLE_ID="${{ steps.parse.outputs.cycle_id }}"
          BRANCH_NAME="drift-fix-${CYCLE_ID}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          # Stage ONLY sanitized summary as evidence — NEVER commit raw plan.json or credentials
          mkdir -p drift-evidence
          cp drift-summary.json drift-evidence/

          git add drift-evidence/drift-summary.json
          git commit -m "chore: sanitized drift evidence for ${CYCLE_ID}"
          git push "https://x-access-token:${AUTH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH_NAME"

      - name: Create or update remediation PR via GitHub API (with deduplication)
        env:
          DRIFT_GITHUB_TOKEN: ${{ secrets.DRIFT_GITHUB_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/create_pr.py \
            --branch "${{ steps.branch.outputs.branch_name }}" \
            --drift-summary drift-summary.json \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"
